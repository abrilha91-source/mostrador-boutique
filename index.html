<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b0306a"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>Mostrador Boutique</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#b0306a;--pl:#fce4ef;--bg:#fff7fa;--t:#2b1a22;--m:#7a6470;--ok:#1f8a5b;--bad:#c62828;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans',system-ui,sans-serif;background:var(--bg);color:var(--t);font-size:15px;padding-bottom:80px}
header{position:sticky;top:0;z-index:5;background:var(--p);color:#fff;padding:12px 14px calc(12px);display:flex;align-items:center;gap:8px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{font-size:11px;background:#fff3;padding:3px 8px;border-radius:99px}
main{padding:12px;max-width:760px;margin:auto}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eedde5;display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 2px;font:inherit;font-size:11px;color:var(--m)}nav button b{display:block;font-size:20px}nav button.on{color:var(--p);font-weight:700}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #b0306a14}
h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:12px 0 6px;color:var(--m)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi{background:var(--pl);border-radius:12px;padding:10px}.kpi small{color:var(--m);display:block;font-size:12px}.kpi b{font-size:18px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid #e3cbd6;border-radius:10px;background:#fff;margin:3px 0 8px}label{font-size:12px;color:var(--m)}
.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;background:var(--p);color:#fff;cursor:pointer}.btn.s{background:var(--pl);color:var(--p)}.btn.sm{padding:5px 10px;font-size:13px}.btn.bad{background:#fde7e7;color:var(--bad)}.full{width:100%}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.list>div{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f3e6ec}.list>div:last-child{border:0}
.grow{flex:1;min-width:0}.mut{color:var(--m);font-size:12px}.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.tabs button{border:0;border-radius:99px;padding:7px 13px;background:#fff;font:inherit;font-size:13px;white-space:nowrap}.tabs button.on{background:var(--p);color:#fff}
.alert{background:#fff4e0;border-left:4px solid #f0a020;padding:8px 10px;border-radius:8px;margin:6px 0;font-size:13px}.pink{color:var(--p);font-weight:700}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center;z-index:20}.modal>div{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#2b1a22;color:#fff;padding:10px 16px;border-radius:99px;z-index:30;font-size:14px}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:6px}.bars div{flex:1;background:var(--p);border-radius:6px 6px 0 0;position:relative;min-height:2px}.bars span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--m)}
.center{text-align:center}.hide{display:none}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-bottom:1px solid #f3e6ec;text-align:left}
details{margin:6px 0}summary{font-weight:600;cursor:pointer;padding:6px 0}
</style></head><body>
<header><h1 id="ttl">Mostrador Boutique</h1><span class="badge" id="who"></span><button class="btn sm s" id="qsale" onclick="go('vender')">+ Venta</button></header>
<main id="app"></main><nav id="nav"></nav>
<script>
const K='mostrador_boutique_v1';
let D=JSON.parse(localStorage.getItem(K)||'null')||{store:null,items:[],clients:[],sales:[],lay:[],exp:[]};
const save=()=>localStorage.setItem(K,JSON.stringify(D));
let S={role:sessionStorage.role||localStorage.mb_role||null,seller:localStorage.mb_seller||'',tab:'inicio',sub:{},cart:[]};
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const money=n=>'$'+(+n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10),dayOf=ts=>new Date(ts).toLocaleDateString('sv'),isToday=ts=>dayOf(ts)===new Date().toLocaleDateString('sv');
const owner=()=>S.role==='owner';
function toast(m){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
async function hash(p){const d=new TextEncoder().encode('mb:'+p);if(crypto.subtle){const h=await crypto.subtle.digest('SHA-256',d);return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=0;for(const b of d)h=(h*31+b)|0;return 'x'+h}
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML='<div>'+html+'</div>';m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m);return m}
const closeM=()=>document.querySelectorAll('.modal').forEach(m=>m.remove());
const cli=id=>D.clients.find(c=>c.id===id),itm=id=>D.items.find(i=>i.id===id);

/* ---------- setup / login ---------- */
function render(){
 if(!D.store)return setup();
 if(!S.role)return login();
 $('#ttl').textContent=D.store.name;$('#who').textContent=owner()?'Dueña':'Caja · '+S.seller;$('#qsale').classList.remove('hide');
 const tabs=owner()?[['inicio','🏠','Inicio'],['vender','🛍️','Vender'],['inventario','👗','Inventario'],['clientas','💬','Clientas'],['dinero','💰','Dinero'],['crecer','⚙️','Crecer']]
  :[['hoy','🧾','Hoy'],['vender','🛍️','Vender'],['inventario','👗','Inventario'],['clientas','💬','Mensajes'],['crecer','❓','Ayuda']];
 if(!tabs.find(t=>t[0]===S.tab))S.tab=tabs[0][0];
 $('#nav').innerHTML=tabs.map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join('');
 $('#app').innerHTML=V[S.tab]();window.scrollTo(0,0);
}
function go(t){S.tab=t;render()}
function setup(){$('#nav').innerHTML='';$('#qsale').classList.add('hide');$('#app').innerHTML=`<div class="card"><h2>Configura tu tienda</h2>
<p class="mut">Esto lo haces tú, una sola vez. Tus datos se guardan solo en este celular.</p>
<label>Nombre de la tienda</label><input id="sn" placeholder="Ej. Boutique Luna">
<label>PIN de 6 números</label><input id="p1" inputmode="numeric" maxlength="6" type="password">
<label>Repite tu PIN</label><input id="p2" inputmode="numeric" maxlength="6" type="password">
<button class="btn full" onclick="createStore()">Crear mi tienda</button>
<p class="mut">¿Tienes un respaldo? <a href="#" onclick="importJSON();return false">Restaurar respaldo</a></p></div>`}
async function createStore(){const n=$('#sn').value.trim(),a=$('#p1').value,b=$('#p2').value;
 if(!n)return toast('Escribe el nombre');if(!/^\d{6}$/.test(a))return toast('El PIN debe tener 6 números');if(a!==b)return toast('Los PIN no coinciden');
 D.store={name:n,pin:await hash(a),regimen:'RESICO',ivaIncl:true,comision:3.5,ivaRate:16};save();S.role='owner';sessionStorage.role='owner';render()}
function login(){$('#nav').innerHTML='';$('#qsale').classList.add('hide');$('#ttl').textContent=D.store.name;$('#who').textContent='';
 $('#app').innerHTML=`<div class="card"><h2>¿Quién eres?</h2><h3>Caja</h3><label>Tu nombre</label><input id="sl" value="${esc(S.seller)}" placeholder="Nombre de la vendedora">
<button class="btn full s" onclick="asCaja()">Entrar a caja</button><h3>Soy la dueña</h3><label>PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="6">
<label><input type="checkbox" id="rem" style="width:auto"> Recordar en este teléfono</label><button class="btn full" onclick="asOwner()">Entrar como dueña</button></div>`}
function asCaja(){const n=$('#sl').value.trim();if(!n)return toast('Escribe tu nombre');S.seller=n;localStorage.mb_seller=n;S.role='caja';sessionStorage.role='caja';render()}
async function asOwner(){if(await hash($('#pin').value)!==D.store.pin)return toast('PIN incorrecto');S.role='owner';sessionStorage.role='owner';if($('#rem').checked)localStorage.mb_role='owner';render()}
function logout(){S.role=null;sessionStorage.removeItem('role');localStorage.removeItem('mb_role');render()}
async function askPin(){const p=prompt('PIN de dueña');return p&&await hash(p)===D.store.pin}

/* ---------- calc ---------- */
function salesIn(from,to){return D.sales.filter(s=>!s.cancel&&s.ts>=from&&s.ts<to)}
function monthRange(d=new Date()){return[new Date(d.getFullYear(),d.getMonth(),1).getTime(),new Date(d.getFullYear(),d.getMonth()+1,1).getTime()]}
const cogs=ss=>ss.reduce((a,s)=>a+s.lines.reduce((b,l)=>b+(l.cost||0)*l.qty,0),0);
const tot=ss=>ss.reduce((a,s)=>a+s.total,0);
function abonosToday(){let r=[];D.lay.forEach(l=>l.pays.forEach(p=>{if(isToday(p.ts))r.push({...p,l})}));return r}
function alerts(){const a=[];D.items.filter(i=>i.qty<=i.min).forEach(i=>a.push(`👗 Resurtir: <b>${esc(i.name)}</b> ${esc(i.size)} ${esc(i.color)} (quedan ${i.qty})`));
 D.lay.filter(l=>l.status==='activo'&&l.due&&l.due<today()).forEach(l=>a.push(`⏰ Apartado vencido: <b>${esc(cli(l.cid)?.name||'Clienta')}</b> · ${esc(l.name)} · debe ${money(l.price-paid(l))}`));
 const m=new Date().getMonth()+1;D.clients.filter(c=>c.bday&&+c.bday.slice(5,7)===m).forEach(c=>a.push(`🎂 Cumple este mes: <b>${esc(c.name)}</b> (${c.bday.slice(8,10)}/${c.bday.slice(5,7)})`));return a}
const paid=l=>l.pays.reduce((a,p)=>a+p.amt,0);
function taxes(m=monthRange()){const ss=salesIn(...m),v=tot(ss),r=D.store.ivaRate/100,base=D.store.ivaIncl?v/(1+r):v;
 const ex=D.exp.filter(e=>{const t=new Date(e.date+'T12:00').getTime();return t>=m[0]&&t<m[1]});
 const ivaAcred=ex.filter(e=>e.fac).reduce((a,e)=>a+e.amt-e.amt/(1+r),0);
 const rate=base<=25000?.01:base<=50000?.011:base<=83333.33?.015:base<=208333.33?.02:.025;
 const isr=D.store.regimen==='RESICO'?base*rate:Math.max(0,(base-cogs(ss)-ex.reduce((a,e)=>a+e.amt,0))*.3);
 const iva=Math.max(0,base*r-ivaAcred);return{v,base,isr,iva,rate,ivaAcred,ex,ss}}
function weekly(n=8){const out=[],now=new Date();now.setHours(0,0,0,0);const st=now.getTime()-((now.getDay()+6)%7)*864e5;
 for(let i=n-1;i>=0;i--){const a=st-i*7*864e5;out.push({l:new Date(a).toLocaleDateString('es-MX',{day:'numeric',month:'short'}),v:tot(salesIn(a,a+7*864e5))})}return out}
function bars(data){const mx=Math.max(1,...data.map(d=>d.v));return `<div class="bars">${data.map(d=>`<div style="height:${d.v/mx*100}%" title="${money(d.v)}"><span>${d.l}</span></div>`).join('')}</div><div style="height:18px"></div>`}

/* ---------- views ---------- */
const V={};
V.inicio=()=>{const m=monthRange(),ss=salesIn(...m),v=tot(ss),t=taxes(),exT=t.ex.reduce((a,e)=>a+e.amt,0),com=ss.filter(s=>s.pay==='Tarjeta').reduce((a,s)=>a+s.total,0)*D.store.comision/100;
 const net=(D.store.ivaIncl?t.base:v)-cogs(ss)-exT-com,al=alerts();
 return `<div class="card"><h2>Este mes</h2><div class="grid"><div class="kpi"><small>Ventas</small><b>${money(v)}</b></div><div class="kpi"><small>Ganancia neta</small><b>${money(net)}</b></div>
 <div class="kpi"><small>Ticket promedio</small><b>${money(ss.length?v/ss.length:0)}</b></div><div class="kpi"><small>Apartar para impuestos</small><b class="pink">${money(t.isr+t.iva)}</b></div></div>
 <h3>Ventas últimas 8 semanas</h3>${bars(weekly())}</div>${hoyCard(true)}
 <div class="card"><h2>Pendientes</h2>${al.length?al.map(x=>`<div class="alert">${x}</div>`).join(''):'<p class="mut">Sin pendientes. 🎉</p>'}</div>`};
function hoyCard(byseller){const ss=D.sales.filter(s=>!s.cancel&&!s.fromLay&&isToday(s.ts)),ab=abonosToday();const by={};
 const k=byseller?'seller':'pay';ss.forEach(s=>by[s[k]]=(by[s[k]]||0)+s.total);
 if(!byseller){by['Abonos']=ab.reduce((a,p)=>a+p.amt,0)}else ab.forEach(p=>by[p.seller]=(by[p.seller]||0)+p.amt);
 const total=tot(ss)+ab.reduce((a,p)=>a+p.amt,0);
 return `<div class="card"><h2>Hoy en caja · ${money(total)}</h2>${Object.keys(by).length?`<table>${Object.entries(by).map(([a,b])=>`<tr><td>${esc(a)}</td><td style="text-align:right">${money(b)}</td></tr>`).join('')}</table>`:'<p class="mut">Aún no hay ventas hoy.</p>'}
 ${!byseller?`<h3>Efectivo por forma de pago (abonos)</h3><p class="mut">${['Efectivo','Tarjeta','Transferencia'].map(p=>p+': '+money(ab.filter(x=>x.pay===p).reduce((a,x)=>a+x.amt,0))).join(' · ')}</p>`:''}</div>`}
V.hoy=()=>{const ss=D.sales.filter(s=>isToday(s.ts));return `<div class="card row"><div class="grow">En caja: <b>${esc(S.seller)}</b></div><button class="btn sm s" onclick="chgName()">Cambiar nombre</button><button class="btn sm s" onclick="logout()">Salir</button></div>${hoyCard(false)}
 <div class="card"><h2>Ventas de hoy</h2>${salesList(ss)}</div>`};
function chgName(){const n=prompt('Nombre de quien está en caja',S.seller);if(n){S.seller=n.trim();localStorage.mb_seller=S.seller;render()}}
function canCancel(s){return owner()||(s.seller===S.seller&&isToday(s.ts))}
function salesList(ss){if(!ss.length)return '<p class="mut">Sin ventas.</p>';return `<div class="list">${ss.slice().sort((a,b)=>b.ts-a.ts).map(s=>`<div><div class="grow"><b>${money(s.total)}</b> · ${s.pay}${s.cancel?' · <span style="color:var(--bad)">CANCELADA</span>':''}<div class="mut">${new Date(s.ts).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'})} · ${esc(s.seller)}${s.cid?' · '+esc(cli(s.cid)?.name||''):''}${s.fromLay?' · apartado':''}</div><div class="mut">${s.lines.map(l=>esc(l.name)+' ×'+l.qty).join(', ')}</div></div>${!s.cancel&&canCancel(s)?`<button class="btn sm bad" onclick="cancelSale('${s.id}')">✕</button>`:''}</div>`).join('')}</div>`}
function cancelSale(id){const s=D.sales.find(x=>x.id===id);if(!canCancel(s))return toast('Solo puedes cancelar tus ventas del día');if(!confirm('¿Cancelar esta venta? Las piezas regresan al inventario.'))return;
 s.cancel=true;s.cancelBy=owner()?'Dueña':S.seller;s.lines.forEach(l=>{const i=itm(l.iid);if(i)i.qty+=l.qty});save();toast('Venta cancelada');render()}
const subtabs=(key,list)=>`<div class="tabs">${list.map(x=>`<button class="${(S.sub[key]||list[0])===x?'on':''}" onclick="S.sub['${key}']='${x}';render()">${x}</button>`).join('')}</div>`;
const cur=(k,d)=>S.sub[k]||d;
V.vender=()=>{const t=cur('v','Nueva venta');let h=subtabs('v',['Nueva venta','Ventas','Apartados']);
 const opts=D.items.filter(i=>i.qty>0).map(i=>`<option value="${i.id}">${esc(i.name)} · ${esc(i.size)} ${esc(i.color)} · ${money(i.price)} (${i.qty})</option>`).join('');
 const copts='<option value="">— Sin clienta —</option>'+D.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
 if(t==='Nueva venta'){const sub=S.cart.reduce((a,l)=>a+l.price*l.qty,0);
  h+=`<div class="card"><label>Prenda</label><select id="ci">${opts||'<option value="">No hay prendas con piezas</option>'}</select><div class="row"><div><label>Cantidad</label><input id="cq" type="number" value="1" min="1"></div><div><label>&nbsp;</label><button class="btn full s" onclick="addCart()">Agregar</button></div></div>
  <div class="list">${S.cart.map((l,i)=>`<div><div class="grow">${esc(l.name)} ×${l.qty}<div class="mut">${money(l.price*l.qty)}</div></div><button class="btn sm bad" onclick="S.cart.splice(${i},1);render()">✕</button></div>`).join('')}</div>
  <label>Forma de pago</label><select id="cp"><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option></select>
  <label>Descuento ($)</label><input id="cd" type="number" value="0" min="0"><label>Clienta</label><select id="cc">${copts}</select>
  <p>Subtotal: <b>${money(sub)}</b></p><button class="btn full" onclick="checkout()">Cobrar venta</button></div>`}
 if(t==='Ventas'){const q=S.q||'';const ss=D.sales.filter(s=>owner()||isToday(s.ts)).filter(s=>!q||JSON.stringify([s.lines.map(l=>l.name),s.seller,cli(s.cid)?.name,s.pay]).toLowerCase().includes(q.toLowerCase()));
  h+=`<div class="card"><input placeholder="🔍 Buscar venta (prenda, clienta, vendedora)" value="${esc(q)}" oninput="S.q=this.value;clearTimeout(window._t);window._t=setTimeout(()=>{render();const e=document.querySelector('main input');e.focus();e.setSelectionRange(99,99)},300)">${salesList(ss)}</div>`}
 if(t==='Apartados'){const act=D.lay.filter(l=>l.status==='activo');
  h+=`<div class="card"><h2>Nuevo apartado</h2><label>Clienta</label><select id="lc">${copts}</select><label>Prenda</label><select id="li">${opts}</select>
  <div class="row"><div><label>Anticipo</label><input id="la" type="number" value="0"></div><div><label>Fecha límite</label><input id="ld" type="date"></div></div>
  <label>Forma de pago del anticipo</label><select id="lp"><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option></select><button class="btn full" onclick="newLay()">Apartar</button></div>
  <div class="card"><h2>Apartados activos (${act.length})</h2><div class="list">${act.map(l=>{const r=l.price-paid(l);return `<div><div class="grow"><b>${esc(cli(l.cid)?.name||'Clienta')}</b> · ${esc(l.name)}<div class="mut">Pagado ${money(paid(l))} de ${money(l.price)} · debe <b>${money(r)}</b> · límite ${l.due||'—'}${l.due&&l.due<today()?' <span style="color:var(--bad)">VENCIDO</span>':''}</div>
  <div class="row" style="margin-top:4px"><input id="ab_${l.id}" type="number" placeholder="Abono" style="margin:0"><select id="abp_${l.id}" style="margin:0"><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option></select><button class="btn sm" onclick="abonar('${l.id}')">Abonar</button></div></div><button class="btn sm bad" onclick="cancelLay('${l.id}')">✕</button></div>`}).join('')||'<p class="mut">Sin apartados.</p>'}</div></div>`}
 return h};
function addCart(){const i=itm($('#ci').value),q=Math.max(1,+$('#cq').value||1);if(!i)return;const inCart=S.cart.filter(l=>l.iid===i.id).reduce((a,l)=>a+l.qty,0);
 if(inCart+q>i.qty)return toast('Solo hay '+i.qty+' piezas');S.cart.push({iid:i.id,name:`${i.name} ${i.size} ${i.color}`.trim(),qty:q,price:i.price,cost:i.cost||0});render()}
function checkout(){if(!S.cart.length)return toast('Agrega al menos una prenda');const sub=S.cart.reduce((a,l)=>a+l.price*l.qty,0),d=Math.min(sub,+$('#cd').value||0);
 S.cart.forEach(l=>itm(l.iid).qty-=l.qty);D.sales.push({id:uid(),ts:Date.now(),lines:S.cart,pay:$('#cp').value,disc:d,total:sub-d,cid:$('#cc').value,seller:owner()?'Dueña':S.seller});
 S.cart=[];save();toast('Venta cobrada ✔');render()}
function newLay(){const i=itm($('#li').value),c=$('#lc').value;if(!c)return toast('Elige la clienta');if(!i)return toast('Elige la prenda');const a=+$('#la').value||0;
 i.qty-=1;const l={id:uid(),ts:Date.now(),cid:c,iid:i.id,name:`${i.name} ${i.size} ${i.color}`.trim(),price:i.price,cost:i.cost||0,due:$('#ld').value,status:'activo',pays:[]};
 if(a>0)l.pays.push({ts:Date.now(),amt:a,pay:$('#lp').value,seller:owner()?'Dueña':S.seller});D.lay.push(l);checkLay(l);save();toast('Prenda apartada');render()}
function abonar(id){const l=D.lay.find(x=>x.id===id),a=+$('#ab_'+id).value;if(!(a>0))return toast('Escribe el abono');l.pays.push({ts:Date.now(),amt:Math.min(a,l.price-paid(l)),pay:$('#abp_'+id).value,seller:owner()?'Dueña':S.seller});checkLay(l);save();toast('Abono registrado');render()}
